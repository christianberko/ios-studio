name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

  build-test:
    name: Build and Test
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Authorize private OverloadKit (optional)
        env:
          OVERLOADKIT_TOKEN: ${{ secrets.OVERLOADKIT_TOKEN }}
        run: |
          if [ -n "${OVERLOADKIT_TOKEN}" ]; then
            git config --global url."https://x-access-token:${OVERLOADKIT_TOKEN}@github.com/".insteadOf "https://github.com/"
          fi

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate, build, and test
        run: |
          xcodegen generate
          # Runner images change their simulator lineup, so pick any available iPhone instead of a fixed name.
          SIM_ID=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          ios = [(runtime, d) for runtime, ds in devices.items() if "iOS" in runtime for d in ds]
          iphones = [d for _, d in sorted(ios, key=lambda pair: pair[0], reverse=True) if d["name"].startswith("iPhone")]
          print(iphones[0]["udid"] if iphones else "")
          ')
          if [ -z "$SIM_ID" ]; then
            echo "No available iPhone simulator on this runner." >&2
            xcrun simctl list devices available
            exit 1
          fi
          xcodebuild test \
            -project TemplateApp.xcodeproj \
            -scheme TemplateApp \
            -destination "id=$SIM_ID" \
            -quiet
