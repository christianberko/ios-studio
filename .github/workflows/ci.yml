name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Run SwiftLint
        run: swiftlint lint --strict --config .swiftlint.yml

  sdk-tests:
    name: SDK Tests
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Show toolchain
        run: xcodebuild -version && swift --version

      - name: Test OverloadKit
        run: swift test

  template-build:
    name: TemplateApp Build
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate and build TemplateApp
        working-directory: Apps/TemplateApp
        run: |
          xcodegen generate
          xcodebuild build \
            -project TemplateApp.xcodeproj \
            -scheme TemplateApp \
            -destination 'generic/platform=iOS Simulator' \
            -quiet
